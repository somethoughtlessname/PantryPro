function msGetOrCreateThinkCard(){
  if(msThinkCardEl) return msThinkCardEl;
  const qaCard=document.createElement('div');
  qaCard.style.cssText=`height:var(--drop-height);display:flex;border:var(--border-width) solid var(--border-color);border-radius:var(--radius);overflow:hidden;flex-shrink:0;`;
  const txt=document.createElement('div');
  txt.style.cssText='flex:1;background:var(--bg-2);display:flex;align-items:center;padding:0 10px;font-size:10px;font-weight:600;color:var(--muted);font-style:italic;';
  const phraseText = msCurrentThinkPhrase.replace(/[.…]+$/, '');
  txt.innerHTML = phraseText + '<span class="thinking-dots" style="font-style:normal;margin-left:1px;"><span>.</span><span>.</span><span>.</span></span>';
  qaCard.appendChild(txt);
  msThinkCardEl = qaCard;
  return qaCard;
}

function msPickNextThinkPhrase(){
  const available = MS_THINK_PHRASES.filter(p=>p!==msCurrentThinkPhrase);
  msCurrentThinkPhrase = available[Math.floor(Math.random()*available.length)];
  msThinkCardEl = null;
}

let msThinkPhraseSet = false;

function msSearchInput(){
  clearTimeout(msSearchIdleTimer);
  clearInterval(msThinkTimer);
  const q = (document.getElementById('msSearch')?.value||'').trim();
  if(!q){ msThinkPhraseSet=false; msQuickAddState=null; msQuickAddName=''; msThinkCardEl=null; msRender(); return; }
  // if user types again after idle fired, reset back to thinking
  if(msQuickAddState && msQuickAddState!=='pick-cat' && msQuickAddState!=='confirm' && msQuickAddState!=='pick-buysize'){
    msQuickAddState=null; msThinkCardEl=null; msPickNextThinkPhrase();
  }
  if(!msThinkPhraseSet){ msPickNextThinkPhrase(); msThinkPhraseSet=true; }
  msRender();
  msSearchIdleTimer = setTimeout(()=>{
    clearInterval(msThinkTimer);
    const allItems = ls('ms_items',[]);
    const qWords = q.toLowerCase().split(/\s+/);
    const exists = allItems.some(i=>{
      const nWords = i.name.toLowerCase().split(/\s+/);
      return qWords.every(qw=>nWords.includes(qw));
    });
    msQuickAddState = exists ? 'found' : 'confirm';
    msQuickAddName = q;
    msRender();
  }, 2000);
}


function msRender(){
  const ap=document.getElementById('msAddPanel');
  if(ap) ap.style.display=msShowAddPanel?'':'none';
  const container=document.getElementById('msList'); container.innerHTML='';
  const items=ls('ms_items',[]);
  const query=(document.getElementById('msSearch')?.value||'').trim().toLowerCase();

  const thinkSlot = document.getElementById('msThinkSlot');
  if(thinkSlot && !query) thinkSlot.innerHTML = '';
  if(query){
    const results=items.filter(i=>{
      const words=i.name.toLowerCase().split(/\s+/);
      return words.some(w=>w.startsWith(query));
    }).sort((a,b)=>a.name.localeCompare(b.name));

    // reset quick-add if query changed
    if(msQuickAddName.toLowerCase() !== query){ msQuickAddState=null; msQuickAddName=query; }

    // exact match — all words in query must exactly match words in item name
    const queryWords=query.toLowerCase().split(/\s+/);
    const exactExists=items.some(i=>{
      const nameWords=i.name.toLowerCase().split(/\s+/);
      return queryWords.every(qw=>nameWords.includes(qw));
    });
    const displayName=document.getElementById('msSearch')?.value.trim()||query;

    // show card always while query active
    const qaCard=document.createElement('div');
    qaCard.style.cssText=`height:var(--drop-height);display:flex;border:var(--border-width) solid var(--border-color);border-radius:var(--radius);overflow:hidden;flex-shrink:0;`;

    if(!msQuickAddState){
      // put think card in slot outside list so innerHTML='' never destroys it
      const slot = document.getElementById('msThinkSlot');
      const card = msGetOrCreateThinkCard();
      if(slot && !slot.contains(card)) slot.appendChild(card);
    } else {
      // clear think slot
      const slot = document.getElementById('msThinkSlot');
      if(slot) slot.innerHTML = '';
      if(msQuickAddState==='success'){
        const ph=MS_SUCCESS_PHRASES[Math.floor(Math.random()*MS_SUCCESS_PHRASES.length)];
        const txt=document.createElement('div');
        txt.style.cssText='flex:1;background:var(--bg-2);display:flex;align-items:center;padding:0 10px;font-size:10px;font-weight:600;color:var(--color-4);';
        txt.textContent=ph; qaCard.appendChild(txt);
      } else if(exactExists || msQuickAddState==='found'){
        const ph=MS_FOUND_PHRASES[Math.floor(Math.random()*MS_FOUND_PHRASES.length)];
        const txt=document.createElement('div');
        txt.style.cssText='flex:1;background:var(--bg-2);display:flex;align-items:center;padding:0 10px;font-size:10px;font-weight:600;color:var(--color-4);';
        txt.textContent=ph;
        qaCard.appendChild(txt);
      } else if(msQuickAddState==='confirm'){
        const txt=document.createElement('div');
        txt.style.cssText='flex:1;min-width:0;background:var(--bg-2);display:flex;align-items:center;padding:0 10px;font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
        txt.innerHTML=`Add <strong style="color:var(--color-10);margin:0 4px;">"${displayName}"</strong> to your store?`;
        const yesBtn=document.createElement('div');
        yesBtn.style.cssText='width:48px;min-width:48px;background:#347ab8;border-left:var(--border-width) solid var(--border-color);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:#fff;cursor:pointer;flex-shrink:0;';
        yesBtn.textContent='YES!';
        yesBtn.onclick=e=>{ e.stopPropagation(); openNewItemOverlay(displayName, ()=>{ msQuickAddState='success'; msRender(); }); };
        qaCard.append(txt,yesBtn);
      } else if(msQuickAddState==='pick-buysize'){
        const bsLbl=document.createElement('div'); bsLbl.style.cssText='flex:1;min-width:0;background:var(--bg-2);display:flex;align-items:center;padding:0 10px;font-size:10px;font-weight:600;color:var(--muted);flex-shrink:0;white-space:nowrap;'; bsLbl.textContent='Buy size:';
        const amtInp=document.createElement('input'); amtInp.type='number'; amtInp.min='0'; amtInp.step='0.1'; amtInp.placeholder='0'; amtInp.value=msQuickAddBuyAmt; amtInp.style.cssText='width:52px;min-width:52px;background:var(--bg-3);border:none;border-left:var(--border-width) solid var(--border-color);color:var(--color-10);font-size:11px;font-weight:700;padding:0 6px;outline:none;font-family:inherit;'; amtInp.oninput=e=>msQuickAddBuyAmt=e.target.value;
        const unitSel=document.createElement('select'); unitSel.style.cssText='width:52px;background:var(--bg-2);border:none;border-left:var(--border-width) solid var(--border-color);color:var(--color-10);font-size:9px;font-weight:700;padding:0 4px;outline:none;font-family:inherit;cursor:pointer;appearance:none;text-align:center;'; MS_BUY_UNITS.forEach(u=>{ const o=document.createElement('option'); o.value=u; o.textContent=u; if(u===msQuickAddBuyUnit) o.selected=true; unitSel.appendChild(o); }); unitSel.onchange=e=>msQuickAddBuyUnit=e.target.value;
        const saveBtn=document.createElement('div'); saveBtn.style.cssText='width:56px;min-width:56px;background:#1d3318;border-left:var(--border-width) solid var(--border-color);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:#48a971;cursor:pointer;'; saveBtn.textContent='SAVE!';
        saveBtn.onclick=e=>{ e.stopPropagation(); const name=msQuickAddName||displayName; const buyAmt=parseFloat(msQuickAddBuyAmt)||0; const newItem={id:'ms_'+Date.now()+Math.random(),name,category:msQuickAddCat,buySize:{amount:buyAmt,unit:msQuickAddBuyUnit}}; const ms=ls('ms_items',[]); ms.push(newItem); lsSet('ms_items',ms); msQuickAddState='success'; msQuickAddName=''; msQuickAddCat=null; msQuickAddBuyAmt=''; msRender(); };
        qaCard.append(bsLbl,amtInp,unitSel,saveBtn);
        const txt=document.createElement('div');
        txt.style.cssText='flex:1;min-width:0;background:var(--bg-2);display:flex;align-items:center;padding:0 10px;font-size:10px;font-weight:600;color:var(--muted);';
        txt.textContent='Pick your category';
        const okBtn=document.createElement('div');
        okBtn.style.cssText='width:48px;min-width:48px;background:var(--color-4);border-left:var(--border-width) solid var(--border-color);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:#000;cursor:pointer;flex-shrink:0;';
        okBtn.textContent='OK!';
        okBtn.onclick=e=>{
          e.stopPropagation();
          window._msQuickAddName=msQuickAddName;
          modalCtx='ms-quickadd'; modalSelPend=null; modalDelPend.clear();
          editingColorCatId=null; selectedRootIdx=0; newCatColor=ROOT_COLORS[0].shades[2];
          document.getElementById('modalTitle').textContent='Category';
          buildModalGrid();
          document.getElementById('modalOverlay').classList.add('open');
        };
        qaCard.append(txt,okBtn);
      }
      container.appendChild(qaCard);
    }
    if(results.length) results.forEach(item=>container.appendChild(msBuildRow(item)));
    return;
  }
  msQuickAddState=null; msQuickAddName='';

  // all cats alphabetically, including empty ones
  const allCats=msGetSortedCats();
  allCats.forEach(cat=>{
    const catItems=items.filter(i=>i.category===cat.id).sort((a,b)=>a.name.localeCompare(b.name));
    const stage=getMsStage(cat.id);
    const section=buildCatSection(cat,catItems,stage,()=>msToggleCat(cat.id),body=>{
      if(msInlineAdd){
        const addRow=document.createElement('div');
        addRow.style.cssText='height:var(--drop-height);display:flex;border:var(--border-width) solid var(--border-color);border-radius:var(--radius);overflow:hidden;flex-shrink:0;';
        const inp=document.createElement('input');
        inp.style.cssText='flex:1;min-width:0;background:var(--bg-3);border:none;color:var(--color-10);font-size:10px;font-weight:600;padding:0 8px;outline:none;';
        inp.placeholder='Add item…'; inp.maxLength=80;
        const addBtn=document.createElement('button');
        addBtn.style.cssText='width:32px;min-width:32px;background:var(--bg-2);border:none;border-left:var(--border-width) solid var(--border-color);color:var(--color-10);font-size:16px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;';
        addBtn.textContent='+';
        const doAdd=()=>{ const name=inp.value.trim(); if(!name) return; msPopulate(name,cat.id); inp.value=''; msRender(); };
        addBtn.onclick=doAdd;
        inp.addEventListener('keydown',e=>{ if(e.key==='Enter') doAdd(); });
        addRow.append(inp,addBtn); body.appendChild(addRow);
      }
      catItems.forEach(item=>body.appendChild(msBuildRow(item)));
    }, '32px');
    section.classList.add('ms');
    container.appendChild(section);
  });
}

function renderSettingsBody(){

function exportData(){
  const obj = {};
  DATA_KEYS.forEach(k=>{ const v=localStorage.getItem(k); if(v!==null) obj[k]=JSON.parse(v); });
  return JSON.stringify(obj, null, 2);
}

function importData(json){
  try {
    const obj = JSON.parse(json);
    DATA_KEYS.forEach(k=>{ if(obj[k]!==undefined) localStorage.setItem(k, JSON.stringify(obj[k])); });
    return true;
  } catch(e){ return false; }
}

function renderDataBody(){
  const body = document.getElementById('dataBody');

  if(dataTab==='export'){

    body.appendChild(ta);

    const btn = document.createElement('button'); btn.className='data-btn green'; btn.textContent='Copy to Clipboard';
    btn.onclick=()=>{
      navigator.clipboard.writeText(ta.value).then(()=>{
        status.textContent='Copied!';
        setTimeout(()=>status.textContent='', 2000);
      }).catch(()=>{
        ta.select(); document.execCommand('copy');
        status.textContent='Copied!';
        setTimeout(()=>status.textContent='', 2000);
      });
    };
    body.appendChild(btn);
  } else {
    const ta = document.createElement('textarea'); ta.className='data-textarea';
    ta.placeholder='Paste exported JSON here…';

    const btn = document.createElement('button'); btn.className='data-btn green'; btn.textContent='Import Data';

      } else {

function renderSalesBody(){
  const body = document.getElementById('salesBody');
  body.innerHTML = '';
  const items = ls('ms_items', []);
  const entries = ls('cs_entries', []);

  const saleEntries = entries.filter(e => isSaleActive(e))
    .sort((a,b)=>{
      const na=items.find(i=>i.id===a.itemId)?.name||'';
      const nb=items.find(i=>i.id===b.itemId)?.name||'';
      return na.localeCompare(nb);
    });

  if(!saleEntries.length){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'No active sales right now.';
    body.appendChild(empty);
    return;
  }

  saleEntries.forEach(entry=>{
    const item = items.find(i=>i.id===entry.itemId);
    if(!item) return;
    const unit = getUnit(item.unit||'unit');
    const regularUp = entry.qty>0 ? entry.price/entry.qty : null;
    const saleUp = entry.sale.price/entry.qty;
    const saving = regularUp!==null ? regularUp-saleUp : null;
    const endD = new Date(entry.sale.ends+'T00:00:00');
    const now = new Date(); now.setHours(0,0,0,0);
    const diff = Math.round((endD-now)/(1000*60*60*24));
    let endStr;
    if(diff<=0) endStr='Ends Today';
    else if(diff===1) endStr='Ends Tomorrow';
    else endStr='Ends '+(endD.getMonth()+1)+'/'+endD.getDate()+'/'+String(endD.getFullYear()).slice(2);

    const card = document.createElement('div');
    card.style.cssText = `border:var(--border-width) solid var(--border-color);border-radius:var(--radius);overflow:hidden;flex-shrink:0;background:var(--bg-2);`;

    // top — item name + store name centered

    const itemName = document.createElement('div');
    itemName.style.cssText = 'font-size:13px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-10);';
    itemName.textContent = item.name;
    const storeName = document.createElement('div');
    storeName.style.cssText = 'font-size:9px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);';
    storeName.textContent = entry.store;
    nameRow.append(itemName, storeName);
    card.appendChild(nameRow);

    // data row — price | savings | date
    const dataRow = document.createElement('div');
    dataRow.style.cssText = `display:flex;align-items:stretch;`;

    // left — regular crossed out + sale price in orange
    const priceCol = document.createElement('div');
    priceCol.style.cssText = 'flex:1;background:var(--bg-3);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;gap:3px;border-right:var(--border-width) solid var(--border-color);';
    const regPrice = document.createElement('div');
    regPrice.style.cssText = 'font-size:9px;font-weight:600;color:var(--muted);text-decoration:line-through;';
    regPrice.textContent = regularUp!==null ? '$'+regularUp.toFixed(2)+'/'+unit.label : '—';
    const salePriceEl = document.createElement('div');
    salePriceEl.style.cssText = 'font-size:11px;font-weight:800;color:#d97f30;';
    salePriceEl.textContent = '$'+saleUp.toFixed(2)+'/'+unit.label;
    priceCol.append(regPrice, salePriceEl);

    // middle — SAVINGS! + amount
    const savCol = document.createElement('div');
    savCol.style.cssText = 'flex:1;background:#374151;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;gap:3px;border-right:var(--border-width) solid var(--border-color);';
    const savLabel = document.createElement('div');
    savLabel.style.cssText = 'font-size:8px;font-weight:900;letter-spacing:0.12em;text-transform:uppercase;color:#7dd4a8;';
    savLabel.textContent = 'SAVINGS!';
    const savAmt = document.createElement('div');
    savAmt.style.cssText = 'font-size:11px;font-weight:800;color:#7dd4a8;';
    savAmt.textContent = saving!==null ? '$'+saving.toFixed(2)+'/'+unit.label : '—';
    savCol.append(savLabel, savAmt);

    // right — end date
    const dateCol = document.createElement('div');
    dateCol.style.cssText = `flex:1;background:var(--bg-3);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;gap:3px;`;
    const dateVal = document.createElement('div');
    dateVal.style.cssText = `font-size:10px;font-weight:800;color:${diff<=1?'#d97f30':'var(--muted)'};white-space:nowrap;`;
    const dateStr = diff<=0?'Today':diff===1?'Tomorrow':(endD.getMonth()+1)+'/'+endD.getDate()+'/'+String(endD.getFullYear()).slice(2);
    dateVal.textContent = 'SALE ENDS ' + dateStr;
    const daysEl = document.createElement('div');
    daysEl.style.cssText = `font-size:8px;font-weight:600;color:${diff<=1?'#d97f30':'var(--muted)'};`;
    daysEl.textContent = diff<=0?'(today)':diff===1?'(1 day)':'('+diff+' days)';
    dateCol.append(dateVal, daysEl);

    dataRow.append(priceCol, savCol, dateCol);
    card.appendChild(dataRow);

    // add to grocery list row
    const glItems = ls('gl_items', []);
    const alreadyInList = glItems.some(g => g.name.toLowerCase() === item.name.toLowerCase());
    const glRow = document.createElement('div');
    glRow.style.cssText = `height:var(--drop-height);display:flex;align-items:center;justify-content:center;border-top:var(--border-width) solid var(--border-color);background:${alreadyInList ? '#1d442d' : '#4f3010'};cursor:${alreadyInList ? 'default' : 'pointer'};font-size:9px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#fff;`;

          trackCatUsage(item.category||'other');
        }
        glRender();
        renderSalesBody();
      };
    }
    card.appendChild(glRow);
    body.appendChild(card);
  });
}

(function(){

  document.addEventListener('touchstart',e=>{
    startX=e.touches[0].clientX; startY=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-startX;
    const dy=Math.abs(e.changedTouches[0].clientY-startY);
    if(dy>80) return; // too vertical
    const isOpen=document.getElementById('settingsDrawer').classList.contains('open');
    if(!isOpen && startX<24 && dx>60) openSettings();
    if(isOpen && dx<-60) closeSettings();
  },{passive:true});
})();

function saveItemPantry(id,pd){ const d=getPantryData(); d[id]=pd; setPantryData(d); }

function getPtUsage(){ return ls('pantry_usage',{}); }
function trackPtUsage(id,amount){
  if(amount<=0) return;
  const u=getPtUsage(); u[id]=(u[id]||0)+amount; lsSet('pantry_usage',u);
  // also log timestamped event for stats graphs
  const log=ls('pantry_usage_log',[]); log.push({id,amount,ts:Date.now()}); lsSet('pantry_usage_log',log);
}

function ptGetStatsValues(id, mode){
  const log=ls('pantry_usage_log',[]);
  const now=new Date();
  const todayMidnight=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const values=new Array(12).fill(0);
  log.filter(e=>e.id===id).forEach(e=>{
    const d=new Date(e.ts);
    if(mode==='daily'){
      const eMidnight=new Date(d.getFullYear(),d.getMonth(),d.getDate());
      const diffDays=Math.round((todayMidnight-eMidnight)/(1000*60*60*24));
      const idx=11-diffDays;
      if(idx>=0&&idx<=11) values[idx]+=e.amount;
    } else if(mode==='weekly'){
      const diffWeeks=Math.floor((now-d)/(1000*60*60*24*7));
      const idx=11-diffWeeks;
      if(idx>=0&&idx<=11) values[idx]+=e.amount;
    } else {
      const diffMonths=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth());
      const idx=11-diffMonths;
      if(idx>=0&&idx<=11) values[idx]+=e.amount;
    }
  });
  return values.map(v=>parseFloat(v.toFixed(2)));
}

function ptGetStock(pd){ return parseFloat(pd.containers.reduce((s,c)=>s+c.amount,0).toFixed(1)); }
function ptGetMax(pd){ return pd.totalCap; }
function ptGetStatus(pd){ const max=ptGetMax(pd); if(max<=0) return 'ok'; const ratio=ptGetStock(pd)/max; if(ratio<=1/6) return 'low'; if(ratio<=1/3) return 'soon'; return 'ok'; }
function ptFillColor(pd){ const st=ptGetStatus(pd); if(st==='ok') return '#48a971'; if(st==='soon') return '#5A8DB8'; return '#C85A5A'; }
function ptConFillColor(con){ const ratio=con.cap>0?con.amount/con.cap:0; if(ratio<=1/6) return '#C85A5A'; if(ratio<=1/3) return '#5A8DB8'; return '#48a971'; }
function ptDarken(hex,pct){ let c=hex.replace('#',''); if(c.length===3) c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2]; const r=Math.max(0,Math.round(parseInt(c.slice(0,2),16)*(1-pct))); const g=Math.max(0,Math.round(parseInt(c.slice(2,4),16)*(1-pct))); const b=Math.max(0,Math.round(parseInt(c.slice(4,6),16)*(1-pct))); return `rgb(${r},${g},${b})`; }

function ptSmartSortItems(items){ if(!smartSort) return items; const usage=getPtUsage(); return [...items].sort((a,b)=>(usage[b.id]||0)-(usage[a.id]||0)); }

function ptApplyFilter(){
  const msItems=ls('ms_items',[]);
  const base=ptViewMode==='pantry' ? msItems.filter(i=>ptIsInPantry(i)) : msItems;
  ptFilterSnapshot=base.filter(item=>{
    if(ptActiveFilter==='all') return true;
    const pd=getItemPantry(item.id);
    return ptGetStatus(pd)===ptActiveFilter;
  });
}

function ptBuildFilterBar(){

  const base=ptViewMode==='pantry' ? msItems.filter(i=>ptIsInPantry(i)) : msItems;
  const total=base.length;

  const bar=document.createElement('div');
  bar.style.cssText=`border:var(--border-width) solid var(--border-color);border-radius:var(--radius);overflow:hidden;flex-shrink:0;display:flex;height:var(--drop-height);`;
  bar.className='pt-filter-bar';
  [{key:'all',label:'All',count:total,color:null},{key:'ok',label:'OK',count:ok,color:'#48a971'},{key:'soon',label:'Low',count:soon,color:'#5A8DB8'},{key:'low',label:'Critical',count:low,color:'#C85A5A'}].forEach(({key,label,count,color},i,arr)=>{

function ptRefreshCard(msItem,pd,wrap,selectedCon,expandView){

  wrap._fillBase.style.width=(bPct*100).toFixed(1)+'%'; wrap._fillBase.style.background=newFc;
  wrap._fillOver.style.width=(oPct*100).toFixed(1)+'%'; wrap._fillOver.style.background=ptDarken(newFc,0.5);
  wrap._val.textContent=`${ptGetStock(pd)}/${ptGetMax(pd)}`;

    const thirtyDaysAgo=Date.now()-(30*24*60*60*1000);
    const usedRecently=ls('pantry_usage_log',[]).some(e=>e.id===msItem.id&&e.ts>=thirtyDaysAgo);

    } else if(expandView.mode==='containers'){
      const selCon=selectedCon.id?pd.containers.find(c=>c.id===selectedCon.id):null;
      const sorted=[...pd.containers].sort((a,b)=>(a.amount===0&&b.amount>0)?1:(b.amount===0&&a.amount>0)?-1:0);
      let pendingConfirm=null;
      if(pd.containers.length===0){ const emptyMsg=document.createElement('div'); emptyMsg.style.cssText='height:var(--card-height);border:3px solid #000;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--bg-2);font-size:9px;font-weight:600;color:var(--muted);font-style:italic;'; emptyMsg.textContent='No containers — add one below'; body.appendChild(emptyMsg); }
      else {

            const card=document.createElement('div'); card.style.cssText=`flex:1;height:var(--card-height);border:3px solid ${isSel?'#fff':'#000'};border-radius:8px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;`;
            const fill=document.createElement('div'); fill.style.cssText=`position:absolute;left:0;top:0;bottom:0;width:${cPct}%;background:${ptConFillColor(con)};opacity:0.3;transition:width 0.3s;pointer-events:none;`;
            const inner=document.createElement('div'); inner.style.cssText='position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;padding:0 4px;box-sizing:border-box;';
            const nmEl=document.createElement('div'); nmEl.style.cssText='font-size:11px;font-weight:800;color:#fff;letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center;'; nmEl.textContent=con.label||'Container';
            const amtEl=document.createElement('div'); amtEl.style.cssText='font-size:10px;font-weight:700;color:rgba(255,255,255,0.7);text-align:center;'; amtEl.textContent=`${con.amount} / ${con.cap}`;
            const prEl=document.createElement('div'); prEl.style.cssText='text-align:center;';
            if(con.free){ prEl.style.cssText+='font-size:9px;font-weight:800;color:#48a971;'; prEl.textContent='FREE'; }
            else if(con.price!=null){ const ppu=con.cap>0?(con.price/con.cap).toFixed(2):'?'; prEl.style.cssText+='font-size:9px;font-weight:700;color:rgba(255,255,255,0.5);'; prEl.textContent='$'+ppu+'/'+(pd.unit||'unit'); }
            else { prEl.style.cssText+='font-size:9px;font-weight:700;color:#C85A5A;'; prEl.textContent='no price'; }
            inner.append(nmEl,amtEl,prEl);
            card.append(fill,inner);
            card.onclick=e=>{ e.stopPropagation(); selectedCon.id=selectedCon.id===con.id?null:con.id; updateBtnState(); renderExpand(); };
            if(con._confirmEmpty) pendingConfirm=con;
            rowEl.appendChild(card);
          });
          body.appendChild(rowEl);
        });
        if(pendingConfirm){ const con=pendingConfirm; const conf=document.createElement('div'); conf.style.cssText=`height:32px;border:3px solid #000;border-radius:8px;overflow:hidden;display:flex;align-items:stretch;`; const msg=document.createElement('div'); msg.style.cssText='flex:1;display:flex;align-items:center;padding:0 10px;font-size:9px;font-weight:700;color:#e08080;background:#2a1010;'; msg.textContent='Container empty?'; const yBtn=document.createElement('div'); yBtn.style.cssText='width:48px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;background:#502424;color:#fff;cursor:pointer;border-left:3px solid #000;'; yBtn.textContent='YES'; yBtn.onclick=e=>{ e.stopPropagation(); con._confirmEmpty=false; con._isEmptyChoice=true; saveItemPantry(msItem.id,pd); renderExpand(); }; const nBtn=document.createElement('div'); nBtn.style.cssText='width:48px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;background:#1d442d;color:#fff;cursor:pointer;border-left:3px solid #000;'; nBtn.textContent='NO'; nBtn.onclick=e=>{ e.stopPropagation(); con.amount=pd.step; con._confirmEmpty=false; saveItemPantry(msItem.id,pd); ptRefreshCard(msItem,pd,wrap,selectedCon,expandView); }; conf.append(msg,yBtn,nBtn); body.appendChild(conf); }
        pd.containers.filter(c=>c._isEmptyChoice).forEach(con=>{ const ch=document.createElement('div'); ch.style.cssText=`border:3px solid #000;border-radius:8px;overflow:hidden;flex-shrink:0;`; const bR=document.createElement('div'); bR.style.cssText='height:32px;display:flex;align-items:stretch;'; const dBtn=document.createElement('div'); dBtn.style.cssText='flex:1;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;letter-spacing:0.06em;text-transform:uppercase;background:#502424;color:#fff;cursor:pointer;border-right:3px solid #000;'; dBtn.textContent='Delete Container'; dBtn.onclick=e=>{ e.stopPropagation(); pd.containers=pd.containers.filter(c=>c.id!==con.id); if(selectedCon.id===con.id) selectedCon.id=null; saveItemPantry(msItem.id,pd); ptRefreshCard(msItem,pd,wrap,selectedCon,expandView); }; const kBtn=document.createElement('div'); kBtn.style.cssText='flex:1;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;letter-spacing:0.06em;text-transform:uppercase;background:#1d3318;color:#48a971;cursor:pointer;'; kBtn.textContent='Keep Empty'; kBtn.onclick=e=>{ e.stopPropagation(); con._isEmptyChoice=false; saveItemPantry(msItem.id,pd); ptRefreshCard(msItem,pd,wrap,selectedCon,expandView); }; bR.append(dBtn,kBtn); ch.append(bR); body.appendChild(ch); });

      // fCard: [empty ×] [label] [fracs] [fill +]
      const fCard=document.createElement('div'); fCard.style.cssText='border:3px solid #000;border-radius:8px;overflow:hidden;flex-shrink:0;display:flex;flex-direction:column;';

      emptyBtn.style.cssText+='width:28px;min-width:28px;border-right:3px solid #000;';
      fRow.appendChild(emptyBtn);
      fracs.forEach(({n,d},i)=>{ const btn=document.createElement('div'); const fc2=fracColors[d]||'var(--bg-2)'; const isSelFrac=selCon2&&parseFloat((selCon2.amount/selCon2.cap).toFixed(4))===parseFloat((n/d).toFixed(4)); btn.style.cssText=`flex:1;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:${isSelFrac?fc2:'#fff'};background:${!selCon2?'var(--bg-4)':isSelFrac?'#fff':fc2};cursor:${selCon2?'pointer':'default'};${i<fracs.length-1?'border-right:3px solid #000;':''}`;  btn.innerHTML=`<sup style="font-size:6px;font-weight:900">${n}</sup><span style="font-size:8px;font-weight:900">/</span><sub style="font-size:6px;font-weight:900">${d}</sub>`; btn.onclick=e=>{ e.stopPropagation(); if(!selCon2) return; selCon2.amount=parseFloat((selCon2.cap*(n/d)).toFixed(1)); saveItemPantry(msItem.id,pd); ptRefreshCard(msItem,pd,wrap,selectedCon,expandView); }; fRow.appendChild(btn); });
      // fill button right
      const fillBtn=makeDoubleTap('+','#C85A5A','#fff',()=>{ selCon.amount=selCon.cap; selCon._confirmEmpty=false; selCon._isEmptyChoice=false; saveItemPantry(msItem.id,pd); ptRefreshCard(msItem,pd,wrap,selectedCon,expandView); });
      fillBtn.style.cssText+='width:28px;min-width:28px;border-left:3px solid #000;';
      fRow.appendChild(fillBtn);
      fCard.appendChild(fRow); body.appendChild(fCard);
      if(!selCon){ fCard.style.display='none'; }

      // Add New Container card
      const addConBtn=document.createElement('div'); addConBtn.style.cssText='height:32px;border:3px solid #000;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:#fff;';

      actCard.append(editSec,editDivider,delSec); body.appendChild(actCard);
      if(!selCon){ actCard.style.display='none'; }

    } else {
      function makeAdjCard(label,getVal,setVal,minVal,getStep){ const card=document.createElement('div'); card.style.cssText=`display:flex;align-items:stretch;height:32px;border:3px solid #000;border-radius:8px;overflow:hidden;flex-shrink:0;`; const m=document.createElement('div'); m.style.cssText='width:32px;min-width:32px;border:none;border-right:3px solid #000;background:var(--bg-2);color:var(--color-10);font-size:18px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;'; m.textContent='−'; const ctr=document.createElement('div'); ctr.style.cssText='flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-3);gap:1px;'; const vEl=document.createElement('div'); vEl.style.cssText='font-size:11px;font-weight:800;'; vEl.textContent=getVal(); const lEl=document.createElement('div'); lEl.style.cssText='font-size:7px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);'; lEl.textContent=label; ctr.append(vEl,lEl); const p=document.createElement('div'); p.style.cssText='width:32px;min-width:32px;border:none;border-left:3px solid #000;background:var(--bg-2);color:var(--color-10);font-size:18px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;'; p.textContent='+'; const step=()=>getStep?getStep():0.5; m.onclick=e=>{ e.stopPropagation(); const v=Math.max(minVal,parseFloat((getVal()-step()).toFixed(1))); setVal(v); vEl.textContent=v; saveItemPantry(msItem.id,pd); ptRefreshCard(msItem,pd,wrap,selectedCon,expandView); }; p.onclick=e=>{ e.stopPropagation(); const v=parseFloat((getVal()+step()).toFixed(1)); setVal(v); vEl.textContent=v; saveItemPantry(msItem.id,pd); ptRefreshCard(msItem,pd,wrap,selectedCon,expandView); }; card.append(m,ctr,p); return card; }
      body.appendChild(makeAdjCard('Total Cap',()=>pd.totalCap,v=>{ pd.totalCap=v; },0,()=>pd.step));
      body.appendChild(makeAdjCard('Step',()=>pd.step,v=>{ pd.step=v; },0.5,()=>0.5));

      // today's usage adjuster — reads/writes pantry_usage_log for today only
      const todayMidnight=new Date(); todayMidnight.setHours(0,0,0,0);
      function getTodayUsage(){
        const log=ls('pantry_usage_log',[]);
        return parseFloat(log.filter(e=>e.id===msItem.id&&new Date(e.ts)>=todayMidnight).reduce((s,e)=>s+e.amount,0).toFixed(2));
      }
      function setTodayUsage(newVal){
        const log=ls('pantry_usage_log',[]);
        // remove all today's entries for this item and replace with one entry
        const filtered=log.filter(e=>!(e.id===msItem.id&&new Date(e.ts)>=todayMidnight));
        if(newVal>0) filtered.push({id:msItem.id,amount:newVal,ts:Date.now()});
        lsSet('pantry_usage_log',filtered);
        // sync pantry_usage total
        const u=getPtUsage();
        u[msItem.id]=parseFloat(ls('pantry_usage_log',[]).filter(e=>e.id===msItem.id).reduce((s,e)=>s+e.amount,0).toFixed(2));
        lsSet('pantry_usage',u);
      }

      const adjUsageCard=makeAdjCard(
        'Used Today',
        ()=>getTodayUsage(),
        v=>setTodayUsage(v),
        0,
        ()=>pd.step
      );
      body.appendChild(adjUsageCard);
    }
    expand.appendChild(body);
  }
  wrap._renderExpand=renderExpand;

  const closeThisCard=()=>{ ptOpenSet.delete(msItem.id); expand.style.maxHeight='0'; expand.style.borderTop='none'; selectedCon.id=null; updateBtnState(); };
  ptCardRegistry.push({close:closeThisCard});
  main.addEventListener('click',()=>{
    if(ptOpenSet.has(msItem.id)){ closeThisCard(); }
    else { ptCardRegistry.forEach(c=>{ if(c.close!==closeThisCard) c.close(); }); ptOpenSet.add(msItem.id); expandView.mode='containers'; expandView.selBar=null; selectedCon.id=null; updateBtnState(); renderExpand(); expand.style.maxHeight='600px'; expand.style.borderTop='3px solid #000'; }
  });
  wrap.appendChild(main);
  wrap.appendChild(expand);
  return wrap;
}

function ptPickNextThinkPhrase(){
  const available=MS_THINK_PHRASES.filter(p=>p!==ptCurrentThinkPhrase);
  ptCurrentThinkPhrase=available[Math.floor(Math.random()*available.length)];
  ptThinkCardEl=null;

function ptGetOrCreateThinkCard(){
  if(ptThinkCardEl) return ptThinkCardEl;
  const card=document.createElement('div');
  card.style.cssText=`height:32px;display:flex;border:3px solid #000;border-radius:8px;overflow:hidden;flex-shrink:0;`;
  const txt=document.createElement('div');
  txt.style.cssText='flex:1;background:var(--bg-2);display:flex;align-items:center;padding:0 10px;font-size:10px;font-weight:600;color:var(--muted);font-style:italic;';

  txt.innerHTML=phraseText+'<span class="thinking-dots" style="font-style:normal;margin-left:1px;"><span>.</span><span>.</span><span>.</span></span>';
  card.appendChild(txt); ptThinkCardEl=card; return card;
}

function ptSearchInput(){
  clearTimeout(ptSearchIdleTimer);
  const q=(document.getElementById('ptSearch')?.value||'').trim();
  if(!q){
    ptThinkPhraseSet=false; ptQuickAddState=null; ptQuickAddName=''; ptThinkCardEl=null;
    ptShowSearchMode(false); return;
  }
  if(ptQuickAddState && ptQuickAddState!=='pick-cat' && ptQuickAddState!=='pick-unit'){
    ptQuickAddState=null; ptThinkCardEl=null; ptPickNextThinkPhrase();
  }
  if(!ptThinkPhraseSet){ ptPickNextThinkPhrase(); ptThinkPhraseSet=true; }
  ptShowSearchMode(true, q);
  ptSearchIdleTimer=setTimeout(()=>{
    const allItems=ls('ms_items',[]);
    const qLower=q.toLowerCase().trim();
    const exists=allItems.some(i=>i.name.toLowerCase().trim()===qLower);
    ptQuickAddState=exists?'found':'confirm';
    ptQuickAddName=q;
    ptRenderThinkSlot(q);
  },2000);
}

// show/hide search mode without rebuilding DOM
function ptShowSearchMode(searching, q){
  const page=document.getElementById('pagePantry');
  const viewTog=page.querySelector('.pt-view-toggle');
  const filterBar=page.querySelector('.pt-filter-bar');
  const itemsWrap=page.querySelector('.pt-items-wrap');
  if(!searching){
    if(viewTog) viewTog.style.display='';
    if(filterBar) filterBar.style.display='';
    if(itemsWrap) itemsWrap.style.display='';
    const slot=document.getElementById('ptThinkSlot'); if(slot) slot.innerHTML='';
    return;
  }
  if(viewTog) viewTog.style.display='none';
  if(filterBar) filterBar.style.display='none';

  // update think slot — show thinking card immediately
  ptRenderThinkSlot(q);

  if(itemsWrap){
    itemsWrap.innerHTML='';
    itemsWrap.style.cssText='display:flex;flex-direction:column;gap:4px;';
    const allItems=ls('ms_items',[]);
    const qLower=(q||'').toLowerCase();
    const matches=allItems.filter(i=>{
      const words=i.name.toLowerCase().split(/\s+/);
      return words.some(w=>w.startsWith(qLower));
    });
    if(matches.length===0){ itemsWrap.style.display='none'; }
    else { matches.forEach(item=>itemsWrap.appendChild(ptBuildCard(item))); }
  }
}

function rxWordMatch(name){ const n=(name||'').toLowerCase(); for(const key of Object.keys(RX_CUP_TO_OZ)){ if(n.includes(key)||key.split(' ').some(kw=>kw.length>3&&n.includes(kw))) return RX_CUP_TO_OZ[key]; } return null; }
function rxCookingUnitToOz(amount,unit,itemName){ const cupOz=rxWordMatch(itemName); if(!cupOz) return null; const u=(unit||'').toLowerCase(); if(u==='cup'||u==='cups') return amount*cupOz; if(u==='tbsp') return amount*(cupOz/16); if(u==='tsp') return amount*(cupOz/48); if(u==='fl oz') return amount*(cupOz/8); return null; }

// Fuzzy pantry item lookup — exact first, then word-stem match
function rxFindPantryItem(ingName){
  const msItems=ls('ms_items',[]);
  const n=ingName.toLowerCase().trim();
  // exact
  let m=msItems.find(i=>i.name.toLowerCase()===n);
  if(m) return m;
  // word-stem: all words in ingredient name appear in item name or vice versa
  const nw=n.split(/\s+/);
  m=msItems.find(i=>{ const iw=i.name.toLowerCase().split(/\s+/); return nw.every(w=>iw.some(iword=>iword.startsWith(w)||w.startsWith(iword))); });
  if(m) return m;
  // single key-word match (e.g. "flour" in "all-purpose flour")
  m=msItems.find(i=>{ const iLow=i.name.toLowerCase(); return nw.some(w=>w.length>3&&iLow.includes(w)); });
  return m||null;
}

function rxSyncIngHave(r){
  const pantryData=ls('pantry_data',{});
  r.ingredients.forEach(ing=>{
    const msItem=rxFindPantryItem(ing.name);
    if(msItem){
      const pd=pantryData[msItem.id];
      const stock=pd?pd.containers.reduce((s,c)=>s+(c.amount||0),0):0;
      const pantryUnit=pd?.unit||'oz';
      const weightUnits=new Set(['oz','lbs','g','kg','fl oz','ml','l']);
      let stockInOz=rxToOz(stock,pantryUnit);
      if(!weightUnits.has(pantryUnit)&&pd?.ozPerUnit) stockInOz=stock*pd.ozPerUnit;
      ing.haveAmt=stockInOz+' oz';
      // only auto-fill needConverted if blank — never overwrite manual entry
      if(!ing.needConverted||ing.needConverted===''){
        const needNum=rxParseNum(ing.needAmt);
        const needUnit=ing.needAmt.replace(/[\d.¼½¾⅓⅔⅛⅜⅝⅞⅕⅖\s]+/,'').trim();
        // try pantry ozPerUnit first (most accurate, item-specific)
        if(pd?.ozPerUnit){
          const u=needUnit.toLowerCase();
          if(u==='cup'||u==='cups') ing.needConverted=String(parseFloat((needNum*pd.ozPerUnit).toFixed(3)));
          else if(u==='tbsp') ing.needConverted=String(parseFloat((needNum*(pd.ozPerUnit/16)).toFixed(3)));
          else if(u==='tsp') ing.needConverted=String(parseFloat((needNum*(pd.ozPerUnit/48)).toFixed(3)));
          else if(u===pantryUnit.toLowerCase()) ing.needConverted=String(parseFloat((needNum*(pd.ozPerUnit)).toFixed(3)));
        }
        // fall back to word-match table
        if(!ing.needConverted){
          const needOz=rxCookingUnitToOz(needNum,needUnit,ing.name);
          if(needOz!=null) ing.needConverted=String(parseFloat(needOz.toFixed(3)));
        }
      }
    }
  });
}

    RX_FRACS.forEach(({n,d},i)=>{ const fc2=RX_FRAC_COLORS[d]||'var(--bg-2)'; const available=selBatch&&!selBatch.confirmFinished&&(n/d)<=selBatch.remaining; const isPending=fracPending.idx===i; const btn=document.createElement('div'); btn.style.cssText=`flex:1;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:900;color:${isPending?fc2:'#fff'};background:${available||isPending?fc2:'var(--bg-4)'};cursor:pointer;${i<RX_FRACS.length-1?'border-right:var(--border-width) solid var(--border-color);':''}`; btn.innerHTML=`<sup style="font-size:5px">${n}</sup><span style="font-size:7px">/</span><sub style="font-size:5px">${d}</sub>`; btn.onclick=e=>{ e.stopPropagation(); if(!selBatch||selBatch.confirmFinished) return; if(available){ selBatch.remaining=parseFloat((n/d).toFixed(4)); const meals=rxGetMeals(); const m=meals.find(m=>m.id===selBatch.id); if(m){ m.remaining=selBatch.remaining; rxSetMeals(meals); } if(selBatch.remaining<=0){ selBatch.remaining=0; selBatch.confirmFinished=true; if(m){ m.remaining=0; m.confirmFinished=true; rxSetMeals(meals); } sel.id=null; } const na=batches.reduce((s,b)=>s+b.remaining,0)/batches.length; fill.style.width=(na*100)+'%'; ns.textContent=batches.length===1?`${Math.round(batches[0].remaining*100)}% left · ${batches[0].cookedDate}`:`${batches.length} batches`; re(); } else { if(fracPending.idx===i){ clearTimeout(fracPending.timer); fracPending={idx:null,timer:null}; selBatch.remaining=parseFloat((n/d).toFixed(4)); selBatch.confirmFinished=false; const meals=rxGetMeals(); const m=meals.find(mm=>mm.id===selBatch.id); if(m){ m.remaining=selBatch.remaining; m.confirmFinished=false; rxSetMeals(meals); } const na=batches.reduce((s,b)=>s+b.remaining,0)/batches.length; fill.style.width=(na*100)+'%'; ns.textContent=batches.length===1?`${Math.round(batches[0].remaining*100)}% left · ${batches[0].cookedDate}`:`${batches.length} batches`; re(); } else { if(fracPending.timer) clearTimeout(fracPending.timer); fracPending.idx=i; fracPending.timer=setTimeout(()=>{ fracPending={idx:null,timer:null}; re(); },3000); re(); } } }; fRow.appendChild(btn); });
    fCard.append(fLbl,fRow); body.appendChild(fCard); expand.appendChild(body);
  }
  main.addEventListener('click',()=>{ if(rxMealOpenId===first.recipeId){ rxMealOpenId=null; expand.style.maxHeight='0'; expand.style.borderTop='none'; } else { document.querySelectorAll('.rx-meal-open').forEach(e=>{ e.style.maxHeight='0'; e.style.borderTop='none'; e.classList.remove('rx-meal-open'); }); rxMealOpenId=first.recipeId; re(); expand.style.maxHeight='600px'; expand.style.borderTop='var(--border-width) solid var(--border-color)'; expand.classList.add('rx-meal-open'); } });
  wrap.append(main,expand); return wrap;
}

function renderMealsBody(){
  const container=document.getElementById('mealsBody'); container.innerHTML=''; const meals=rxGetMeals(); const history=rxGetHistory();
  if(!meals.length&&!history.length){ const e=document.createElement('div'); e.style.cssText='display:flex;align-items:center;justify-content:center;padding:40px;font-size:10px;font-weight:600;color:var(--muted);font-style:italic;text-align:center;'; e.textContent='No meals yet. Cook a recipe to get started.'; container.appendChild(e); return; }
  if(meals.length){ container.appendChild(rxDiv('Active Meals','#48a971')); const groups={}; meals.forEach(m=>{ if(!groups[m.recipeId]) groups[m.recipeId]=[]; groups[m.recipeId].push(m); }); Object.values(groups).forEach(batches=>container.appendChild(rxBuildMealGroupCard(batches))); }
  if(history.length){ container.appendChild(rxDiv('History','var(--muted)')); history.forEach(h=>{ const row=document.createElement('div'); row.style.cssText='height:32px;border:var(--border-width) solid var(--border-color);border-radius:var(--radius);overflow:hidden;display:flex;align-items:stretch;flex-shrink:0;'; const ne=document.createElement('div'); ne.style.cssText='flex:1;display:flex;align-items:center;padding:0 10px;font-size:9px;font-weight:700;color:#fff;background:var(--bg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'; ne.textContent=h.recipeName; const de=document.createElement('div'); de.style.cssText='width:56px;min-width:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-2);border-left:var(--border-width) solid var(--border-color);gap:1px;'; const dv=document.createElement('div'); dv.style.cssText='font-size:11px;font-weight:800;color:#48a971;'; dv.textContent=h.days+'d'; const dl=document.createElement('div'); dl.style.cssText='font-size:6px;font-weight:700;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;'; dl.textContent='lasted'; de.append(dv,dl); const dte=document.createElement('div'); dte.style.cssText='width:88px;min-width:88px;display:flex;align-items:center;justify-content:center;background:var(--bg-3);border-left:var(--border-width) solid var(--border-color);font-size:8px;font-weight:700;color:var(--muted);'; dte.textContent=h.cookedDate+'–'+h.finishedDate; row.append(ne,de,dte); container.appendChild(row); }); }
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js')
      .then(r=>console.log('[PantryPro] SW registered', r.scope))
      .catch(e=>console.log('[PantryPro] SW failed', e));
  });
}
